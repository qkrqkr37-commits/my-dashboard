<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%23060911'/><path d='M12 3.4 19.7 7.7v8.6L12 20.6 4.3 16.3V7.7L12 3.4Z' fill='none' stroke='%2322D3EE' stroke-width='1.5'/><circle cx='12' cy='12' r='1.9' fill='%2310B981'/></svg>">
<title>MY · COMMAND BOARD</title>
<style>
/* ============ base ============ */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#060911;
  --card:rgba(16,24,39,.80);
  --line:rgba(148,163,184,.14);
  --line-soft:rgba(148,163,184,.08);
  --t1:#F8FAFC; --t2:#94A3B8; --t3:#64748B;
  --cyan:#22D3EE; --emerald:#10B981; --amber:#F59E0B; --rose:#F43F5E; --violet:#A78BFA;
  --r:16px;
  --font:'Pretendard','Pretendard Variable','Apple SD Gothic Neo','Malgun Gothic',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg); color:var(--t1); font-family:var(--font);
  font-size:13px; line-height:1.45; -webkit-font-smoothing:antialiased;
  letter-spacing:-0.01em; min-height:100dvh; overflow-x:hidden;
  font-variant-numeric:tabular-nums;
}
b,strong{font-weight:600}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;font-size:inherit;letter-spacing:inherit}
input,select{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:rgba(34,211,238,.28)}
.num{font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(148,163,184,.22);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ambient light + mesh */
.ambient,.mesh{position:fixed;inset:0;pointer-events:none;z-index:0}
.ambient{
  background:
    radial-gradient(760px 460px at 4% -6%, rgba(34,211,238,.16), transparent 68%),
    radial-gradient(620px 420px at 98% 2%, rgba(16,185,129,.13), transparent 70%),
    radial-gradient(900px 540px at 46% 118%, rgba(99,102,241,.15), transparent 72%);
}
.mesh{
  background-image:
    linear-gradient(rgba(148,163,184,.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(148,163,184,.055) 1px, transparent 1px);
  background-size:66px 66px;
  -webkit-mask-image:radial-gradient(120% 90% at 50% 22%, #000 12%, transparent 76%);
  mask-image:radial-gradient(120% 90% at 50% 22%, #000 12%, transparent 76%);
  opacity:.85;
}

/* ============ command bar ============ */
.cmdbar{
  position:relative; z-index:30; display:flex; align-items:center; gap:14px;
  height:64px; padding:0 20px;
  background:linear-gradient(180deg, rgba(9,14,24,.92), rgba(7,11,19,.72));
  border-bottom:1px solid rgba(148,163,184,.10);
  backdrop-filter:blur(16px) saturate(140%);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{
  width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;
  background:linear-gradient(150deg, rgba(34,211,238,.20), rgba(16,185,129,.10) 55%, rgba(15,22,36,.4));
  border:1px solid rgba(34,211,238,.28);
  box-shadow:0 0 22px -6px rgba(34,211,238,.5), inset 0 1px 0 rgba(255,255,255,.10);
}
.brand-title{font-size:12px;font-weight:600;letter-spacing:.15em;color:#E2F6FF;white-space:nowrap}
.brand-title .sep{color:var(--cyan);opacity:.65}
.brand-sub{font-size:10.5px;color:var(--t3);letter-spacing:.02em;margin-top:1px;white-space:nowrap}
.views{
  display:flex;gap:3px;padding:3px;margin-left:6px;
  background:rgba(255,255,255,.028);border:1px solid var(--line-soft);border-radius:12px;
}
.views button{
  padding:7px 11px;border-radius:9px;font-size:11.5px;color:var(--t2);
  transition:background .18s,color .18s,box-shadow .18s;white-space:nowrap;
}
.views button:hover{color:#DCE9F5;background:rgba(255,255,255,.04)}
.views button.on{
  color:#D9FBFF;
  background:linear-gradient(180deg, rgba(34,211,238,.20), rgba(34,211,238,.07));
  box-shadow:inset 0 0 0 1px rgba(34,211,238,.32), 0 6px 18px -12px rgba(34,211,238,.9);
}
.cmd-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.demo-chip{
  display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:999px;
  font-size:10.5px;color:#A9BACD;border:1px dashed rgba(148,163,184,.28);
  background:rgba(255,255,255,.02);white-space:nowrap;transition:.18s;
}
.demo-chip:hover{border-color:rgba(34,211,238,.45);color:#CFF6FF;background:rgba(34,211,238,.06)}
.demo-chip i{width:5px;height:5px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber)}
.clock{text-align:right;line-height:1.1;padding-right:2px}
.clock b{display:block;font-size:16px;font-weight:600;letter-spacing:.02em;color:#EDF6FE}
.clock span{font-size:9.5px;color:var(--t3);letter-spacing:.1em}
.clock b::after{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--emerald);
  margin-left:6px;vertical-align:middle;box-shadow:0 0 8px var(--emerald);animation:blink 2.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.icon-btn{
  width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--t2);
  border:1px solid var(--line-soft);background:rgba(255,255,255,.025);transition:.16s;
}
.icon-btn:hover{color:#E6F4FF;border-color:rgba(148,163,184,.28);background:rgba(255,255,255,.05)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:34px;padding:0 13px;border-radius:10px;font-size:12px;font-weight:500;
  border:1px solid var(--line);background:rgba(255,255,255,.03);color:#DCE9F5;
  transition:.16s;white-space:nowrap;
}
.btn:hover{background:rgba(255,255,255,.06);border-color:rgba(148,163,184,.26)}
.btn.primary{
  color:#D7FCFF;font-weight:600;border-color:rgba(34,211,238,.38);
  background:linear-gradient(180deg, rgba(34,211,238,.24), rgba(34,211,238,.08));
  box-shadow:0 8px 22px -14px rgba(34,211,238,.9), inset 0 1px 0 rgba(255,255,255,.10);
}
.btn.primary:hover{background:linear-gradient(180deg, rgba(34,211,238,.32), rgba(34,211,238,.12));box-shadow:0 10px 26px -12px rgba(34,211,238,.8)}
.btn.emerald{color:#D6FFEF;border-color:rgba(16,185,129,.38);background:linear-gradient(180deg, rgba(16,185,129,.22), rgba(16,185,129,.07))}
.btn.ghost{background:transparent;border-color:transparent;color:var(--t2)}
.btn.ghost:hover{color:#E6F4FF;background:rgba(255,255,255,.05)}
.btn.sm{height:28px;padding:0 10px;font-size:11px;border-radius:8px}

.menu-pop{
  position:fixed;z-index:90;min-width:196px;padding:6px;display:none;
  background:linear-gradient(180deg, rgba(20,29,45,.98), rgba(12,18,30,.99));
  border:1px solid rgba(148,163,184,.20);border-radius:13px;
  box-shadow:0 26px 50px -22px #000, inset 0 1px 0 rgba(255,255,255,.06);
}
.menu-pop.open{display:block}
.menu-pop button{display:flex;width:100%;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;font-size:12px;color:#CFDCEA;text-align:left}
.menu-pop button:hover{background:rgba(34,211,238,.10);color:#EAFBFF}
.menu-pop .msep{height:1px;background:var(--line-soft);margin:5px 4px}
.menu-pop .mtitle{font-size:9.5px;letter-spacing:.14em;color:var(--t3);padding:7px 10px 3px}
.menu-pop .mnote{font-size:11px;color:var(--t2);padding:6px 10px 10px;line-height:1.5;max-width:230px}
.menu-pop svg{flex:none;opacity:.75}

/* ============ layout ============ */
.app{
  position:relative;z-index:1;padding:14px 20px 16px;
  height:calc(100dvh - 64px);
  display:grid;grid-template-rows:minmax(0,1.5fr) minmax(0,1fr);gap:13px;
}
.board{display:grid;grid-template-columns:4fr 5.15fr 3.35fr;gap:13px;min-height:0;min-width:0}
.col{display:flex;flex-direction:column;gap:13px;min-height:0;min-width:0}

/* ============ card ============ */
.card{
  position:relative;min-height:0;min-width:0;padding:14px 15px 13px;
  display:flex;flex-direction:column;
  background:var(--card);
  background-image:linear-gradient(180deg, rgba(255,255,255,.03), transparent 38%);
  border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 20px 44px -30px #000, inset 0 1px 0 rgba(255,255,255,.045);
  backdrop-filter:blur(14px) saturate(130%);
  overflow:hidden;
}
.card::before{
  content:'';position:absolute;left:14px;right:14px;top:0;height:1px;
  background:linear-gradient(90deg, transparent, var(--accent,rgba(148,163,184,.55)), transparent);
  opacity:.55;
}
.card::after{
  content:'';position:absolute;inset:0;border-radius:var(--r);pointer-events:none;
  background:radial-gradient(220px 120px at 0% 0%, color-mix(in srgb, var(--accent,#22D3EE) 12%, transparent), transparent 70%);
  opacity:.5;
}
.card>*{position:relative;z-index:1}
.card-hd{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex:none}
.card-title{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:600;letter-spacing:.17em;color:#8FA3B8;text-transform:uppercase;white-space:nowrap}
.card-title .dot{width:5px;height:5px;border-radius:2px;background:var(--accent);box-shadow:0 0 9px var(--accent)}
.card-hd-r{margin-left:auto;display:flex;align-items:center;gap:7px}

/* ============ today ============ */
#cardToday{--accent:#22D3EE;flex:1;min-height:0}
.today-top{display:flex;align-items:center;gap:11px;flex:none}
.ring{width:44px;height:44px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.4;stroke-linecap:round}
.ring .bg{stroke:rgba(148,163,184,.14)}
.ring .fg{stroke:url(#ringGrad);filter:drop-shadow(0 0 4px rgba(34,211,238,.55));transition:stroke-dashoffset .5s cubic-bezier(.4,0,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:10.5px;font-weight:600;color:#DFF9FF}
.today-meta{min-width:0}
.today-meta .d{font-size:15px;font-weight:600;letter-spacing:-.02em;color:#F2F8FE;display:flex;align-items:center;gap:6px}
.today-meta .d em{font-style:normal;font-size:10px;font-weight:600;color:var(--cyan);background:rgba(34,211,238,.12);border:1px solid rgba(34,211,238,.28);border-radius:99px;padding:1px 6px;letter-spacing:.04em}
.today-meta .s{font-size:10.5px;color:var(--t3);margin-top:1px}
.today-count{margin-left:auto;text-align:right;flex:none}
.today-count b{display:block;font-size:15px;font-weight:600;color:#E9F6FF}
.today-count span{font-size:9.5px;color:var(--t3);letter-spacing:.06em}
.prog{height:3px;border-radius:99px;background:rgba(148,163,184,.12);overflow:hidden;margin:10px 0 8px;flex:none}
.rt-strip{display:flex;gap:4px;margin:0 0 7px;flex:none;overflow:hidden}
.rmini{display:inline-flex;align-items:center;gap:4px;height:21px;padding:0 7px;border-radius:99px;font-size:9px;letter-spacing:-.01em;border:1px solid rgba(148,163,184,.16);background:transparent;color:#7489A0;transition:.14s;white-space:nowrap}
.rmini:hover{border-color:rgba(148,163,184,.32);color:#C7D8E8}
.rmini.on{border-color:rgba(16,185,129,.42);background:rgba(16,185,129,.14);color:#A9F6D5}
.rmini i{width:4px;height:4px;border-radius:50%;flex:none}
.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#22D3EE,#10B981);box-shadow:0 0 10px rgba(34,211,238,.65);transition:width .45s cubic-bezier(.4,0,.2,1)}

.sect-label{font-size:9.5px;letter-spacing:.14em;color:#7489A0;display:flex;align-items:center;gap:6px;margin:2px 0 4px;flex:none}
.sect-label i{flex:1;height:1px;background:linear-gradient(90deg, rgba(148,163,184,.16), transparent)}
.tasks{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:1px;margin:-2px -4px 0;padding:2px 4px 2px}
.task{
  display:flex;align-items:flex-start;gap:9px;padding:4px 6px;border-radius:10px;
  border:1px solid transparent;transition:.16s;position:relative;
}
.task:hover{background:rgba(255,255,255,.035);border-color:rgba(148,163,184,.10)}
.task.done .t-txt{color:#5D7186;text-decoration:line-through;text-decoration-color:rgba(148,163,184,.45)}
.task.done .t-note{color:#42566B}
.chk{
  width:17px;height:17px;flex:none;margin-top:1px;border-radius:6px;border:1px solid rgba(148,163,184,.34);
  display:grid;place-items:center;transition:.16s;background:rgba(255,255,255,.02);
}
.chk svg{width:10px;height:10px;opacity:0;transform:scale(.6);transition:.16s}
.task.done .chk{background:linear-gradient(150deg, rgba(16,185,129,.9), rgba(34,211,238,.75));border-color:transparent;box-shadow:0 0 12px -3px rgba(16,185,129,.9)}
.task.done .chk svg{opacity:1;transform:scale(1)}
.t-body{min-width:0;flex:1}
.t-txt{font-size:12.5px;color:#E7F0F9;line-height:1.3;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.t-note{font-size:10px;color:var(--t3);margin-top:2px;line-height:1.35}
.tag{font-size:9px;font-weight:600;letter-spacing:.02em;padding:1.5px 6px;border-radius:99px;border:1px solid;white-space:nowrap;line-height:1.5}
.dday{
  font-size:9px;font-weight:700;letter-spacing:.02em;padding:1.5px 6px;border-radius:99px;white-space:nowrap;
  color:#FFE1E7;background:rgba(244,63,94,.16);border:1px solid rgba(244,63,94,.4);
  box-shadow:0 0 12px -4px rgba(244,63,94,.8);animation:pulseR 3.4s infinite;
}
@keyframes pulseR{0%,100%{box-shadow:0 0 10px -5px rgba(244,63,94,.7)}50%{box-shadow:0 0 16px -2px rgba(244,63,94,.55)}}
.t-del{opacity:0;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:var(--t3);flex:none;transition:.14s}
.task:hover .t-del{opacity:1}
.t-del:hover{color:#FFD7DE;background:rgba(244,63,94,.16)}
.quick-add{display:flex;align-items:center;gap:7px;margin-top:7px;padding-top:8px;border-top:1px solid var(--line-soft);flex:none}
.quick-add .plus{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:var(--cyan);background:rgba(34,211,238,.10);border:1px solid rgba(34,211,238,.22);font-size:13px;line-height:1;flex:none}
.quick-add input{
  flex:1;min-width:0;height:28px;background:none;border:0;border-bottom:1px solid transparent;
  padding:0 2px;font-size:12px;color:#E7F0F9;outline:none;transition:.16s;
}
.quick-add input::placeholder{color:#526980}
.quick-add input:focus{border-bottom-color:rgba(34,211,238,.4)}
.qtag{display:flex;align-items:center;gap:4px;height:24px;padding:0 7px;border-radius:7px;font-size:9.5px;font-weight:600;border:1px solid;flex:none}

/* ============ briefing ============ */
#cardBriefing{--accent:#A78BFA;flex:none;padding:12px 14px 11px}
.brief{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 9px;border-radius:11px;
  border:1px solid rgba(167,139,250,.16);background:linear-gradient(100deg, rgba(167,139,250,.09), rgba(34,211,238,.04));
  transition:.18s;
}
.brief:hover{background:linear-gradient(100deg, rgba(167,139,250,.15), rgba(34,211,238,.07));border-color:rgba(167,139,250,.32)}
.brief-ico{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none;background:rgba(167,139,250,.13);border:1px solid rgba(167,139,250,.24);color:#D9CCFF}
.brief-t{min-width:0;flex:1}
.brief-t b{display:block;font-size:11.5px;font-weight:600;color:#ECE6FF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brief-t span{display:block;font-size:10px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.brief-go{color:#8FA3B8;flex:none;font-size:10px;display:flex;align-items:center;gap:3px}
.brief-chips{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:99px;font-size:9.5px;font-weight:600;border:1px solid;white-space:nowrap}
.chip.good{color:#A7F3D0;background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.30)}
.chip.warn{color:#FDE5B8;background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.30)}
.chip.info{color:#BFEAFB;background:rgba(34,211,238,.10);border-color:rgba(34,211,238,.26)}
.chip.bad{color:#FFD7DE;background:rgba(244,63,94,.12);border-color:rgba(244,63,94,.28)}

/* ============ calendar ============ */
#cardCalendar{--accent:#22D3EE;flex:1;min-height:0}
.cal-hd{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex:none}
.cal-title{font-size:14.5px;font-weight:600;letter-spacing:-.02em;color:#EFF7FE}
.cal-title em{font-style:normal;font-size:10px;color:var(--t3);margin-left:5px;letter-spacing:.02em}
.cal-nav{display:flex;align-items:center;gap:3px;margin-left:auto}
.cal-nav button{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--t2);border:1px solid transparent;transition:.14s}
.cal-nav button:hover{background:rgba(255,255,255,.06);color:#E9F7FF;border-color:var(--line-soft)}
.cal-nav .today{width:auto;padding:0 8px;font-size:10px;color:#A8EAF6;border-color:rgba(34,211,238,.22);background:rgba(34,211,238,.08)}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;flex:none}
.weekdays span{text-align:center;font-size:9.5px;letter-spacing:.06em;color:#6C8299;padding:2px 0}
.weekdays span:first-child{color:rgba(244,63,94,.75)}
.weekdays span:last-child{color:rgba(96,165,250,.8)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,minmax(0,1fr));gap:4px;flex:1;min-height:0}
.day{
  position:relative;border-radius:9px;border:1px solid rgba(148,163,184,.055);padding:5px 5px 4px;
  display:flex;flex-direction:column;justify-content:space-between;min-height:0;min-width:0;
  background:rgba(255,255,255,.014);
  transition:background .16s,border-color .16s,transform .16s;
}
.day:hover{background:rgba(255,255,255,.055);border-color:rgba(148,163,184,.20);transform:translateY(-1px)}
.day.out{opacity:.26}
.day .n{font-size:11px;color:#C9D8E6;letter-spacing:.01em;display:flex;align-items:center;justify-content:space-between}
.day.sun .n{color:rgba(255,160,175,.85)}
.day.sat .n{color:rgba(147,197,253,.85)}
.day .dots{display:flex;gap:3px;align-items:center;min-height:4px}
.day .dots i{width:4px;height:4px;border-radius:50%;display:block}
.day .mini{font-size:8px;color:#7E94AA;letter-spacing:.02em}

.day.today{border-color:rgba(34,211,238,.5);box-shadow:inset 0 0 18px -8px rgba(34,211,238,.9), 0 0 16px -10px rgba(34,211,238,.8)}
.day.today .n{color:#9DF3FF;font-weight:600}
.day.sel{background:rgba(34,211,238,.15);border-color:rgba(34,211,238,.6)}
.day.sel .n{color:#DFFBFF;font-weight:600}
.cal-foot{display:flex;align-items:center;gap:8px;margin-top:8px;flex:none;padding-top:8px;border-top:1px solid var(--line-soft)}
.legend{display:flex;gap:9px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:4px;font-size:9px;color:#7E94AA}
.legend i{width:5px;height:5px;border-radius:50%}
.cal-hint{margin-left:auto;font-size:9.5px;color:#5F758B;white-space:nowrap}

/* ============ portfolio ============ */
#cardPortfolio{--accent:#10B981;flex:1;min-height:0}
.pf-top{display:flex;align-items:center;gap:10px;margin-bottom:2px;flex:none}
.pf-kpi{font-size:10px;color:var(--t3)}
.pf-kpi b{color:#C8F7E4;font-weight:600}
.pf-change{margin-left:auto;font-size:10px;font-weight:600;color:#A7F3D0;background:rgba(16,185,129,.11);border:1px solid rgba(16,185,129,.26);border-radius:99px;padding:2px 7px}
.donut-wrap{position:relative;width:100%;max-width:162px;margin:5px auto 0;aspect-ratio:1;flex:none;align-self:center}
.donut-wrap svg{width:100%;height:100%;display:block}
.donut-wrap .seg{cursor:pointer;transition:stroke-width .2s, opacity .2s}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:0 14px}
.donut-center .lbl{font-size:9px;letter-spacing:.14em;color:#6F859B;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.donut-center .val{font-size:19px;font-weight:600;letter-spacing:-.03em;color:#F4FBF8;margin-top:2px;white-space:nowrap}
.donut-center .sub{font-size:9.5px;color:#7E94AA;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pf-legend{display:flex;flex-direction:column;gap:0;margin-top:7px;flex:none}
.pf-row{display:flex;align-items:center;gap:7px;padding:3.5px 6px;border-radius:8px;transition:.14s;cursor:pointer;text-align:left;width:100%}
.pf-row:hover,.pf-row.on{background:rgba(255,255,255,.045)}
.pf-row .bar{width:3px;height:14px;border-radius:2px;flex:none}
.pf-row .nm{font-size:11.5px;color:#DDE9F3;min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-row .wt{font-size:11.5px;font-weight:600;color:#EAF3FA;flex:none;letter-spacing:-.01em}
.pf-row .am{font-size:9.5px;color:#6F859B;flex:none;width:74px;text-align:right}
.pf-insights{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px;flex:none}
.pf-hint{font-size:9px;color:#566C82;margin-top:6px;text-align:center;flex:none}

/* ============ market ============ */
#cardMarket{--accent:#F59E0B;flex:none;padding:10px 14px 8px}
#cardMarket .card-hd{margin-bottom:3px}
.mk-row{display:flex;align-items:center;gap:8px;padding:3px 0}
.mk-nm{font-size:11px;color:#C4D4E3;width:56px;flex:none}
.mk-v{font-size:11.5px;font-weight:600;color:#EAF3FA;flex:1;letter-spacing:-.01em}
.mk-ch{font-size:9.5px;font-weight:600;padding:1.5px 6px;border-radius:99px;flex:none}
.mk-ch.up{color:#A7F3D0;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.28)}
.mk-ch.dn{color:#FFD7DE;background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.28)}
.mk-spark{width:58px;height:22px;flex:none}

/* ============ ledger ============ */
#cardLedger{--accent:#F43F5E}
.ledger-body{display:grid;grid-template-columns:210px minmax(0,1fr) 282px;gap:18px;flex:1;min-height:0;margin-top:2px;overflow:hidden}
.range{display:flex;gap:2px;padding:2px;border:1px solid var(--line-soft);border-radius:7px;margin-left:2px}
.range button{font-size:9px;padding:2px 7px;border-radius:5px;color:#7489A0}
.range button.on{background:rgba(34,211,238,.12);color:#B6F4FF;box-shadow:inset 0 0 0 1px rgba(34,211,238,.22)}
.lg-kpis{display:flex;flex-direction:column;gap:0;min-height:0}
.kpi{padding:2px 0 3px;border-bottom:1px solid var(--line-soft)}
.kpi:last-of-type{border-bottom:0}
.kpi .k{font-size:9.5px;letter-spacing:.1em;color:#7489A0;display:flex;align-items:center;gap:5px}
.kpi .k i{width:4px;height:4px;border-radius:50%}
.kpi .v{font-size:17px;font-weight:600;letter-spacing:-.03em;margin-top:1px;color:#F1F8FE;line-height:1.15}
.kpi .v small{font-size:10px;font-weight:500;color:#6F859B;margin-left:3px;letter-spacing:0}
.kpi .s{font-size:9px;color:#6F859B;margin-top:1px}
.kpi.inc .v{color:#B8F5DA}
.kpi.exp .v{color:#FFD5DC}
.lg-chips{display:flex;flex-direction:column;gap:3px;margin-top:auto;padding-top:5px}
.lg-chips .chip{font-size:9px;padding:1px 6px;width:fit-content}

.lg-chart{display:flex;flex-direction:column;min-height:0}
.chart-hd{display:flex;align-items:center;gap:9px;flex:none;margin-bottom:2px}
.chart-hd .t{font-size:10px;letter-spacing:.1em;color:#8FA3B8}
.chart-hd .lg{display:flex;gap:9px;margin-left:auto}
.chart-hd .lg span{display:flex;align-items:center;gap:4px;font-size:9px;color:#7E94AA}
.chart-hd .lg i{width:6px;height:6px;border-radius:2px}
.chart{position:relative;flex:1;min-height:96px;margin-top:6px;padding:0 0 16px 32px}
.chart .gridlines{position:absolute;inset:0 0 16px 32px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.chart .gridlines i{height:1px;background:rgba(148,163,184,.075);display:block}
.chart .gridlines i:first-child{background:rgba(148,163,184,.14)}
.bars{position:absolute;inset:0 0 0 32px;display:flex;align-items:flex-end;gap:0;padding-bottom:16px}
.wg{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;min-width:0}
.pair{display:flex;align-items:flex-end;gap:4px;height:100%;width:100%;justify-content:center;padding:0 8px;position:relative;z-index:1}
.wg.cur .wlab{color:#9DEFFC;font-weight:600}
.bar{width:min(34px,36%);border-radius:6px 6px 3px 3px;min-height:0;position:relative;transition:height .55s cubic-bezier(.4,0,.2,1), filter .16s}
.ylab{position:absolute;left:0;width:28px;font-size:8px;color:#5F758B;text-align:right;transform:translateY(-50%)}
.bar.in{background:linear-gradient(180deg,#34D399,#0E9F6E);box-shadow:0 0 14px -6px rgba(16,185,129,.9)}
.bar.out{background:linear-gradient(180deg,#FB7185,#B4435B);box-shadow:0 0 14px -6px rgba(244,63,94,.8)}
.bar:hover{filter:brightness(1.22)}
.wlab{position:absolute;left:0;right:0;bottom:-13px;text-align:center;font-size:8.5px;color:#6F859B;letter-spacing:.06em;white-space:nowrap}
.netline{position:absolute;inset:0 0 16px 32px;width:calc(100% - 32px);height:calc(100% - 16px);pointer-events:none;overflow:visible}
.netline polyline{fill:none;stroke:#38E1F5;stroke-width:1.2;stroke-dasharray:3 4;opacity:.5;vector-effect:non-scaling-stroke}
.netdots{position:absolute;inset:0 0 16px 32px;pointer-events:none}
.ndot{position:absolute;width:5px;height:5px;border-radius:50%;background:#0A101B;border:1px solid rgba(56,225,245,.8);transform:translate(-50%,-50%);box-shadow:0 0 6px rgba(56,225,245,.35)}

.lg-side{display:flex;flex-direction:column;min-height:0;gap:6px}
.gauge{position:relative;height:78px;flex:none;margin-top:1px}
.gauge svg{width:100%;height:100%;display:block}
.gauge .gl{position:absolute;left:0;right:0;bottom:2px;text-align:center}
.gauge .gl b{font-size:15px;font-weight:600;color:#FFE3E8;letter-spacing:-.02em}
.gauge .gl b small{font-size:9px;color:#7E94AA;font-weight:500;margin-left:2px;letter-spacing:0}
.gauge .gl span{display:block;font-size:9px;color:#6F859B;margin-top:-1px}
.catbar{display:flex;height:7px;border-radius:99px;overflow:hidden;background:rgba(148,163,184,.10);flex:none;margin-top:2px}
.catbar i{height:100%;display:block;transition:flex .45s}
.catlegend{display:grid;grid-template-columns:1fr 1fr;gap:1px 8px;margin-top:5px}
.catlegend span{display:flex;align-items:center;gap:4px;font-size:9px;color:#8298AD;min-width:0}
.catlegend i{width:4px;height:4px;border-radius:1px;flex:none}
.catlegend b{font-weight:600;color:#C7D7E6;margin-left:auto;font-size:9px}

.lg-recent{display:flex;align-items:center;gap:7px;margin-top:9px;padding-top:8px;border-top:1px solid var(--line-soft);flex:none;overflow:hidden}
.lg-recent .tagline{font-size:9px;letter-spacing:.12em;color:#61788E;flex:none}
.entry{display:flex;align-items:center;gap:5px;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.028);border:1px solid var(--line-soft);font-size:9.5px;color:#93A8BC;white-space:nowrap;flex:none}
.entry i{width:4px;height:4px;border-radius:50%;flex:none}
.entry b{font-weight:600;color:#CFDDEA}
.entry .neg{color:#FFC9D2;font-weight:600}
.entry .pos{color:#A9EFCF;font-weight:600}

/* ============ modal ============ */
.modal-root{position:fixed;inset:0;z-index:80;display:none}
.modal-root.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(3,6,12,.66);backdrop-filter:blur(7px);opacity:0;transition:opacity .2s}
.modal-root.open .backdrop{opacity:1}
.modal{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-46%) scale(.985);
  width:min(500px,calc(100vw - 32px));max-height:min(88dvh,800px);
  display:flex;flex-direction:column;opacity:0;
  background:linear-gradient(180deg, rgba(19,27,42,.97), rgba(11,17,28,.985));
  border:1px solid rgba(148,163,184,.20);border-radius:18px;
  box-shadow:0 50px 100px -40px #000, 0 0 0 1px rgba(34,211,238,.05), inset 0 1px 0 rgba(255,255,255,.07);
  transition:transform .22s cubic-bezier(.2,.8,.3,1), opacity .2s;overflow:hidden;
}
.modal-root.open .modal{opacity:1;transform:translate(-50%,-50%) scale(1)}
.modal::before{content:'';position:absolute;top:0;left:20px;right:20px;height:1px;background:linear-gradient(90deg,transparent,rgba(34,211,238,.55),transparent)}
.m-hd{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 11px;flex:none}
.m-hd .t{font-size:15px;font-weight:600;letter-spacing:-.02em;color:#F2F9FF;display:flex;align-items:center;gap:7px}
.m-hd .s{font-size:10.5px;color:#7489A0;margin-top:2px}
.m-hd .m-title-lg{font-size:16px}
.m-close{margin-left:auto;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#7E94AA;flex:none}
.m-close:hover{background:rgba(255,255,255,.07);color:#E6F4FF}
.m-body{padding:0 18px 16px;overflow-y:auto;flex:1;min-height:0}
.m-foot{padding:10px 18px 14px;border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:10px;flex:none;background:rgba(8,13,22,.4)}
.m-sect{font-size:9.5px;letter-spacing:.15em;color:#6F859B;margin:12px 0 7px;display:flex;align-items:center;gap:7px}
.m-sect:first-child{margin-top:0}
.m-sect i{flex:1;height:1px;background:linear-gradient(90deg,rgba(148,163,184,.16),transparent)}

.rt-grid{display:flex;flex-wrap:wrap;gap:6px}
.rt{
  display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px;border-radius:10px;
  border:1px solid var(--line);background:rgba(255,255,255,.025);font-size:11.5px;color:#A9BDD0;transition:.16s;
}
.rt:hover{border-color:rgba(148,163,184,.3);color:#E3EFFA}
.rt .ck{width:14px;height:14px;border-radius:4px;border:1px solid rgba(148,163,184,.4);display:grid;place-items:center;flex:none;transition:.16s}
.rt .ck svg{width:9px;height:9px;opacity:0}
.rt.on{color:#E9FFF8;border-color:rgba(16,185,129,.4);background:linear-gradient(180deg,rgba(16,185,129,.20),rgba(16,185,129,.06))}
.rt.on .ck{background:linear-gradient(150deg,#10B981,#22D3EE);border-color:transparent}
.rt.on .ck svg{opacity:1}

.dtask{display:flex;align-items:flex-start;gap:9px;padding:8px 8px;border-radius:10px;border:1px solid transparent;transition:.14s}
.dtask:hover{background:rgba(255,255,255,.035);border-color:var(--line-soft)}
.dtask .t-txt{font-size:12.5px}
.dtask.done .t-txt{color:#5D7186;text-decoration:line-through}
.dtask .t-note{font-size:10px}
.dtask.done .chk{background:linear-gradient(150deg,rgba(16,185,129,.9),rgba(34,211,238,.75));border-color:transparent}
.dtask.done .chk svg{opacity:1;transform:scale(1)}
.empty{padding:14px;text-align:center;font-size:11px;color:#5F758B;border:1px dashed rgba(148,163,184,.18);border-radius:10px}

.addbox{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:9px;background:rgba(255,255,255,.02)}
.addbox input[type=text]{
  width:100%;height:32px;background:rgba(255,255,255,.03);border:1px solid var(--line-soft);border-radius:8px;
  padding:0 10px;font-size:12px;outline:none;color:#E7F0F9;
}
.addbox input[type=text]::placeholder{color:#526980}
.addbox input[type=text]:focus{border-color:rgba(34,211,238,.45);box-shadow:0 0 0 3px rgba(34,211,238,.08)}
.addrow{display:flex;align-items:center;gap:5px;margin-top:7px}
.tchip{height:24px;padding:0 8px;border-radius:99px;font-size:9.5px;font-weight:600;border:1px solid;opacity:.55;transition:.14s}
.tchip:hover{opacity:.85}
.tchip.on{opacity:1;box-shadow:0 0 0 1px currentColor inset}
.addrow .btn{margin-left:auto}

.m-prog{flex:1;min-width:0}
.m-prog .bar{width:100%;height:4px;border-radius:99px;background:rgba(148,163,184,.13);overflow:hidden}
.m-prog .bar i{display:block;height:100%;background:linear-gradient(90deg,#22D3EE,#10B981);border-radius:99px;transition:width .4s}
.m-prog span{display:block;font-size:9.5px;color:#7489A0;margin-top:5px}

/* ledger modal */
.seg{display:flex;gap:4px;padding:3px;background:rgba(255,255,255,.03);border:1px solid var(--line-soft);border-radius:11px;margin-bottom:12px}
.seg button{flex:1;height:32px;border-radius:8px;font-size:12px;color:#94A8BC;transition:.16s;display:flex;align-items:center;justify-content:center;gap:5px}
.seg button.on{color:#EAFBFF;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(148,163,184,.2)}
.seg button[data-type=out].on{color:#FFD9DF;background:rgba(244,63,94,.13);box-shadow:inset 0 0 0 1px rgba(244,63,94,.32)}
.seg button[data-type=in].on{color:#C8F8E3;background:rgba(16,185,129,.13);box-shadow:inset 0 0 0 1px rgba(16,185,129,.32)}
.amt-display{
  border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.008));
  padding:10px 13px 11px;margin-bottom:9px;
}
.amt-display .al{font-size:9px;letter-spacing:.14em;color:#6F859B}
.amt-display .av{font-size:29px;font-weight:600;letter-spacing:-.035em;text-align:right;color:#F4FAFF;line-height:1.2;min-height:37px}
.amt-display .av .cur{font-size:15px;color:#7489A0;margin-right:4px;font-weight:500}
.amt-display.out .av{color:#FFDCE2}
.amt-display.in .av{color:#C9FBE7}
.quick-amts{display:flex;gap:5px;margin-bottom:9px}
.quick-amts button{flex:1;height:26px;border-radius:7px;font-size:10px;color:#9EB2C6;border:1px solid var(--line);background:rgba(255,255,255,.025)}
.quick-amts button:hover{color:#DDF4FF;border-color:rgba(34,211,238,.35);background:rgba(34,211,238,.08)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.pad button{
  height:38px;border-radius:10px;font-size:15px;font-weight:500;color:#DCE9F5;
  border:1px solid var(--line-soft);background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
  transition:.1s;
}
.pad button:hover{background:rgba(255,255,255,.09);border-color:rgba(148,163,184,.26)}
.pad button:active{transform:scale(.97)}
.pad button.del{color:#FFB9C4;font-size:13px}
.cat-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.cat-chips button{height:27px;padding:0 10px;border-radius:8px;font-size:10.5px;border:1px solid var(--line);color:#9EB2C6;background:rgba(255,255,255,.02);transition:.14s;display:flex;align-items:center;gap:5px}
.cat-chips button i{width:5px;height:5px;border-radius:50%}
.cat-chips button.on{color:#EAF7FF;background:rgba(34,211,238,.10);border-color:rgba(34,211,238,.35)}
.fields{display:flex;gap:7px}
.field{flex:1;min-width:0}
.field label{display:block;font-size:9px;letter-spacing:.1em;color:#6F859B;margin-bottom:4px}
.field input{
  width:100%;height:33px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.03);
  padding:0 10px;font-size:11.5px;outline:none;color:#E7F0F9;
}
.field input:focus{border-color:rgba(34,211,238,.45)}
.field input::-webkit-calendar-picker-indicator{filter:invert(.6)}
.wide-btn{width:100%;height:40px;border-radius:11px;font-size:12.5px;font-weight:600}

/* portfolio edit */
.pf-edit-row{display:flex;align-items:center;gap:7px;padding:7px 0;border-bottom:1px solid var(--line-soft)}
.pf-edit-row .cdot{width:8px;height:8px;border-radius:50%;flex:none}
.pf-edit-row input.nm{flex:1;min-width:0;background:none;border:0;border-bottom:1px solid transparent;font-size:12px;color:#E7F0F9;padding:3px 0;outline:none}
.pf-edit-row input.nm:focus{border-bottom-color:rgba(34,211,238,.4)}
.pf-edit-row input.amt{width:104px;text-align:right;background:rgba(255,255,255,.03);border:1px solid var(--line-soft);border-radius:7px;height:27px;padding:0 7px;font-size:11px;color:#DCE9F5;outline:none}
.pf-edit-row .wt{width:44px;text-align:right;font-size:10.5px;color:#8FA3B8;flex:none}
.pf-edit-row .rm{width:22px;height:22px;border-radius:6px;color:#6F859B;display:grid;place-items:center;flex:none}
.pf-edit-row .rm:hover{color:#FFC2CC;background:rgba(244,63,94,.14)}
.pf-total{display:flex;align-items:center;justify-content:space-between;padding:9px 2px 0;font-size:11px;color:#8FA3B8}
.pf-total b{font-size:14px;color:#F1F8FE;font-weight:600}

/* briefing modal */
.brf{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.brf:last-child{border-bottom:0}
.brf .idx{width:19px;height:19px;border-radius:6px;display:grid;place-items:center;font-size:9.5px;font-weight:700;color:#9DEFFC;background:rgba(34,211,238,.10);border:1px solid rgba(34,211,238,.22);flex:none;margin-top:1px}
.brf .bc{min-width:0;flex:1}
.brf .bt{font-size:12px;font-weight:600;color:#EAF4FD;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.brf .bd{font-size:11px;color:#8FA3B8;line-height:1.55;margin-top:3px}

/* toast */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:120;
  padding:9px 14px;border-radius:11px;font-size:11.5px;color:#DCF7FF;
  background:rgba(14,21,34,.95);border:1px solid rgba(34,211,238,.28);
  box-shadow:0 20px 40px -18px #000;opacity:0;pointer-events:none;transition:.24s;white-space:nowrap;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* mobile nav */
.mnav{display:none}

/* ============ responsive ============ */
@media (min-width:1100px){
  body{overflow:hidden}
}
@media (min-width:1100px) and (max-height:880px){
  .app{padding:10px 15px 12px;gap:10px}
  .board{gap:10px}
  .col{gap:10px}
  .card{padding:10px 12px 9px}
  .card-hd{margin-bottom:6px}
  #cardToday .ring{width:38px;height:38px}
  .today-meta .d{font-size:14px}
  .prog{margin:7px 0 6px}
  .rt-strip{margin-bottom:5px}
  .rmini{height:19px;font-size:8.5px;padding:0 6px}
  .sect-label{margin:0 0 2px}
  .task{padding:3px 5px}
  .t-txt{font-size:12px}
  .t-note{font-size:9.5px;margin-top:1px}
  .task .chk{width:16px;height:16px}
  .quick-add{padding-top:6px;margin-top:5px}
  .quick-add input{height:26px}
  .brief{padding:6px 8px}
  .brief-ico{width:25px;height:25px;border-radius:8px}
  .brief-t b{font-size:11px}
  .cal-hd{margin-bottom:6px}
  .cal-grid{gap:3px}
  .day{padding:3px 4px 3px}
  .cal-foot{padding-top:6px;margin-top:6px}
  .donut-wrap{flex:1 1 0;min-height:70px;width:auto;aspect-ratio:1;max-height:168px;max-width:100%;align-self:center;margin:2px auto 0}
  .donut-center .val{font-size:16px}
  .donut-center .sub{font-size:8.5px}
  .pf-legend{margin-top:5px}
  .pf-row{padding:2.5px 6px}
  .pf-insights{margin-top:4px}
  .pf-hint{margin-top:4px;font-size:8.5px}
  #cardMarket{padding:8px 12px 7px}
  .mk-row{padding:2px 0}
  .ledger-body{gap:14px}
  .kpi{padding:1px 0 2px}
  .kpi .v{font-size:16px}
  .kpi .s{font-size:8.5px}
  .lg-chips{padding-top:2px;gap:2px}
  .lg-chips .chip{font-size:8.5px;padding:0 6px}
  .chart-hd{margin-bottom:0}
  .chart{min-height:70px;margin-top:3px}
  .gauge{height:70px}
  .lg-recent{margin-top:6px;padding-top:5px}
}
@media (max-width:1099px){
  body{overflow-x:hidden;padding-bottom:70px}

const KEY='command_board_v2';
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
const NOW=new Date();
const TODAY=keyOf(NOW);
/* sample dates always land on and around today, so the demo never looks stale */
const shiftKey=off=>keyOf(new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()+off));
const monthKey=day=>{const dim=new Date(NOW.getFullYear(),NOW.getMonth()+1,0).getDate();return `${NOW.getFullYear()}-${pad(NOW.getMonth()+1)}-${pad(Math.min(day,dim))}`;};
const monthOffKey=n=>{const d=new Date(NOW.getFullYear(),NOW.getMonth()+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;};
const DEFAULT_HISTORY=(()=>{
  const base=[[3150000,1860000],[3240000,2120000],[3180000,1540000],[3320000,2480000],[3280000,1420000]];
  const o={};
  base.forEach((v,i)=>{ o[monthOffKey(i-5)]={inc:v[0],exp:v[1]}; });
  return o;
})();

  study:{label:'공부',c:'#22D3EE'},
  workout:{label:'운동',c:'#10B981'},

  personal:{label:'개인',c:'#A78BFA'},
  due:{label:'마감',c:'#F43F5E'}
};

  {k:'eng',label:'영어 공부',c:'#22D3EE'},
  {k:'econ',label:'경제 공부',c:'#A78BFA'},
  {k:'workout',label:'운동',c:'#10B981'},
  {k:'diet',label:'식단',c:'#F59E0B'},
  {k:'insta',label:'인스타',c:'#F43F5E'}
];
const CATS={
  '식비':'#F59E0B','고정비':'#22D3EE','교통':'#A78BFA','쇼핑':'#F43F5E','여가':'#10B981','기타':'#94A3B8'
};

let S=(()=>{
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw) return seedState();
    const p=JSON.parse(raw);
    if(!p||p.version!==2) return seedState();
    p.days=p.days||{}; p.ledger=Array.isArray(p.ledger)?p.ledger:[]; p.holdings=Array.isArray(p.holdings)?p.holdings:[];
    p.budget=p.budget||2300000; p.view=p.view||'all'; p.history=p.history||DEFAULT_HISTORY;
    p.calCursor=p.calCursor||{y:NOW.getFullYear(),m:NOW.getMonth()};
    return p;
  }catch(e){ return seedState(); }
})();

function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

function getDay(k){ return S.days[k] || {routines:{},tasks:[]}; }
function ensureDay(k){
  if(!S.days[k]) S.days[k]={routines:{},tasks:[]};
  if(!S.days[k].routines) S.days[k].routines={};
  if(!S.days[k].tasks) S.days[k].tasks=[];
  return S.days[k];
}
function dayStats(k){
  const d=getDay(k);
  const rTotal=ROUTINES.length;
  const rDone=ROUTINES.filter(r=>d.routines&&d.routines[r.k]).length;
  const tTotal=d.tasks.length;
  const tDone=d.tasks.filter(t=>t.done).length;
  const total=rTotal+tTotal, done=rDone+tDone;
  return {rTotal,rDone,tTotal,tDone,total,done,pct: total? Math.round(done/total*100):0, ratio: total? done/total:0};
}
function dday(due){
  const a=parseKey(TODAY).getTime(), b=parseKey(due).getTime();
  return Math.round((b-a)/86400000);
}

  const n=new Date();
  const t=document.getElementById('clockTime');
  const d=document.getElementById('clockDate');
  if(t) t.textContent=`${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
  if(d) d.textContent=`KST · ${pad(n.getMonth()+1)}.${pad(n.getDate())} ${weekdayKR[n.getDay()]}`;
  const sub=document.getElementById('brandSub');
  if(sub){

}

   ========================================================= */
let calCursor={...S.calCursor};
let selectedDay=TODAY;

function renderCalendar(){
  const y=calCursor.y, m=calCursor.m;
  document.getElementById('calTitle').innerHTML=`${y}년 ${m+1}월 <em>${Object.keys(S.days).filter(k=>k.startsWith(`${y}-${pad(m+1)}`)).length}일 기록</em>`;
  const first=new Date(y,m,1);
  const startWd=first.getDay();
  const daysInMonth=new Date(y,m+1,0).getDate();
  const prevDays=new Date(y,m,0).getDate();
  const cells=[];
  for(let i=0;i<startWd;i++){ cells.push({d:prevDays-startWd+1+i,out:true,date:new Date(y,m-1,prevDays-startWd+1+i)}); }
  for(let d=1;d<=daysInMonth;d++){ cells.push({d,out:false,date:new Date(y,m,d)}); }
  let next=1;
  while(cells.length<42){ cells.push({d:next,out:true,date:new Date(y,m+1,next++)}); }

  const grid=document.getElementById('calGrid');
  grid.innerHTML=cells.map(c=>{
    const k=keyOf(c.date);
    const wd=c.date.getDay();
    const day=S.days[k];
    const st=dayStats(k);
    const has=day && (day.tasks.length||ROUTINES.some(r=>day.routines&&day.routines[r.k]));
    const tags=[...new Set((day?day.tasks:[]).map(t=>t.tag))].slice(0,3);
    const dots=tags.map(t=>`<i style="background:${(TAGS[t]||TAGS.personal).c};box-shadow:0 0 6px ${(TAGS[t]||TAGS.personal).c}66"></i>`).join('');
    const heat = has? clamp(Math.round(st.ratio*10)/10,0,1) : 0;
    const heatBg = heat>0? `background:rgba(34,211,238,${(0.055+heat*0.115).toFixed(3)})` : '';
    const cls=['day'];
    if(c.out) cls.push('out');
    if(wd===0) cls.push('sun');
    if(wd===6) cls.push('sat');
    if(k===TODAY) cls.push('today');
    if(k===selectedDay) cls.push('sel');
    return `<button class="${cls.join(' ')}" data-day="${k}" style="${heatBg}" aria-label="${m+1}월 ${c.d}일">
      <span class="n"><span>${c.d}</span>${st.tTotal? `<span class="mini">${st.tDone}/${st.tTotal}</span>`:''}</span>
      <span class="dots">${dots}</span>
    </button>`;
  }).join('');
  document.getElementById('calLegend').innerHTML=TAG_ORDER.map(t=>
    `<span><i style="background:${TAGS[t].c}"></i>${TAGS[t].label}</span>`).join('');
}

  const b=e.target.closest('[data-day]'); if(!b) return;
  openDay(b.dataset.day);
});

  S.calCursor={...calCursor}; save(); renderCalendar();

const MARKETS=[
  {name:'나스닥',value:'23,879.20',chg:0.62,seed:7,drift:1},
  {name:'다우',value:'49,097.06',chg:-0.18,seed:23,drift:-1},
  {name:'S&P 500',value:'7,175.83',chg:0.41,seed:41,drift:1}
];
function sparkPath(seed,drift,w,h){
  const rnd=mulberry32(seed);
  const n=18; const pts=[];
  let v=0.5;
  for(let i=0;i<n;i++){
    v += (rnd()-0.5)*0.22 + drift*0.022;
    v = clamp(v,0.1,0.9);
    pts.push(v);
  }
  pts[n-1] = clamp(0.5 + drift*0.28 + (rnd()-0.5)*0.1, 0.12, 0.9);
  return pts.map((p,i)=>[i/(n-1)*w, h-(p*h)]).map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
}
function renderMarket(){
  const box=document.getElementById('marketRows');
  box.innerHTML=MARKETS.map(m=>{
    const up=m.chg>=0;
    const color=up?'#10B981':'#F43F5E';
    const d=sparkPath(m.seed,m.drift,58,20);
    const id='sg'+m.seed;
    return `<div class="mk-row">
      <span class="mk-nm">${m.name}</span>
      <span class="mk-v">${m.value}</span>
      <span class="mk-ch ${up?'up':'dn'}">${up?'▲':'▼'} ${Math.abs(m.chg).toFixed(2)}%</span>
      <svg class="mk-spark" viewBox="0 0 58 20" preserveAspectRatio="none" aria-hidden="true">
        <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/>
        </linearGradient></defs>
        <path d="${d} L58 20 L0 20 Z" fill="url(#${id})"/>
        <path d="${d}" fill="none" stroke="${color}" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      </svg>
    </div>`;
  }).join('');
}

/* =========================================================

   ========================================================= */
function monthEntries(y,m){
  const pre=`${y}-${pad(m+1)}`;
  return S.ledger.filter(e=>e.date.startsWith(pre));
}
function ledgerStats(y,m){
  const es=monthEntries(y,m);
  const inc=sum(es.filter(e=>e.type==='in'),e=>e.amount);
  const exp=sum(es.filter(e=>e.type==='out'),e=>e.amount);
  const byCat={};
  es.filter(e=>e.type==='out').forEach(e=>{byCat[e.cat]=(byCat[e.cat]||0)+e.amount;});
  return {es,inc,exp,net:inc-exp,byCat,budget:S.budget,used:S.budget?exp/S.budget:0,
    remain:S.budget-exp, rate: inc? (inc-exp)/inc*100:0};
}
function ledgerMonth(){
  const cur=`${NOW.getFullYear()}-${pad(NOW.getMonth()+1)}`;
  if(S.ledger.some(e=>e.date.startsWith(cur))) return {y:NOW.getFullYear(),m:NOW.getMonth()};
  const latest=[...S.ledger].sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(latest){const [yy,mm]=latest.date.split('-').map(Number); return {y:yy,m:mm-1};}
  return {y:NOW.getFullYear(),m:NOW.getMonth()};
}
function renderLedger(){
  const {y,m}=ledgerMonth();
  const label=document.getElementById('ledgerMonthLabel');
  if(label) label.textContent=`· ${y}년 ${m+1}월`;
  const st=ledgerStats(y,m);
  const usedPct=Math.round(st.used*100);
  const good=usedPct<=80;
  document.getElementById('lgKpis').innerHTML=`
    <div class="kpi inc">
      <div class="k"><i style="background:#10B981"></i>이번 달 수입</div>
      <div class="v">${fmt(st.inc)}<small>원</small></div>
      <div class="s">월급 + 부수입 ${st.es.filter(e=>e.type==='in').length}건</div>
    </div>
    <div class="kpi exp">
      <div class="k"><i style="background:#F43F5E"></i>이번 달 지출</div>
      <div class="v">${fmt(st.exp)}<small>원</small></div>
      <div class="s">${st.es.filter(e=>e.type==='out').length}건 · 하루 평균 ${fmt(st.exp/20)}원</div>
    </div>
    <div class="kpi">
      <div class="k"><i style="background:#22D3EE"></i>남은 예산</div>
      <div class="v">${fmt(st.remain)}<small>원</small></div>
      <div class="s">저축률 ${st.rate.toFixed(1)}% · 예산 ${fmt(st.budget)}원</div>
    </div>
    <div class="lg-chips">
      <span class="chip ${good?'good':'bad'}">예산 대비 ${good?'양호':'초과'} · ${usedPct}% 사용</span>
      <span class="chip ${st.rate>=30?'info':'warn'}">저축률 ${st.rate.toFixed(1)}% · 목표 30%</span>
    </div>`;

  /* bars: monthly (default) / weekly */
  let groups,rangeLabel;
  if(lgRange==='m'){
    groups=[];
    for(let i=5;i>=0;i--){
      const dt=new Date(y,m-i,1);
      const ym=`${dt.getFullYear()}-${pad(dt.getMonth()+1)}`;
      let inc=0,exp=0;
      if(ym===`${y}-${pad(m+1)}`){ inc=st.inc; exp=st.exp; }
      else if(S.history&&S.history[ym]){ inc=S.history[ym].inc; exp=S.history[ym].exp; }
      groups.push({l:(dt.getMonth()+1)+'월',inc,exp,cur:i===0});
    }
    rangeLabel='최근 6개월';
  }else{
    const defs=[];
    const lastDay=new Date(y,m+1,0).getDate();
    let dd=1, wi=1;
    while(dd<=lastDay){
      const toD=Math.min(dd+6,lastDay);
      defs.push({l:'W'+wi,from:`${y}-${pad(m+1)}-${pad(dd)}`,to:`${y}-${pad(m+1)}-${pad(toD)}`});
      dd=toD+1; wi++;
    }
    const sameMonth=(NOW.getFullYear()===y&&NOW.getMonth()===m);
    groups=defs.filter(w=>!sameMonth||w.from<=TODAY).map(w=>{
      const es=S.ledger.filter(e=>e.date>=w.from&&e.date<=w.to);
      return {...w,cur:(TODAY>=w.from&&TODAY<=w.to),
        inc:sum(es.filter(e=>e.type==='in'),e=>e.amount),
        exp:sum(es.filter(e=>e.type==='out'),e=>e.amount)};
    });
    rangeLabel=`${m+1}월 주간`;
  }
  const maxV=Math.max(1,...groups.map(w=>Math.max(w.inc,w.exp)));
  const steps=[100000,200000,500000,1000000,2000000,5000000,10000000];
  const step=steps.find(s=>s*4>=maxV)||10000000;
  const niceMax=step*4;
  const maxNet=Math.max(1,...groups.map(w=>w.inc-w.exp));
  const bars=groups.map(w=>{
    const ih=w.inc? Math.max(2,w.inc/niceMax*100):0;
    const eh=w.exp? Math.max(2,w.exp/niceMax*100):0;
    return `<div class="wg${w.cur?' cur':''}"><div class="pair">
      <span class="bar in" style="height:${w.inc?Math.max(1.5,w.inc/niceMax*100).toFixed(1):0}%" title="${w.l} 수입 ${won(w.inc)}"></span>
      <span class="bar out" style="height:${w.exp?Math.max(1.5,w.exp/niceMax*100).toFixed(1):0}%" title="${w.l} 지출 ${won(w.exp)}"></span>
    </div><span class="wlab">${w.l}</span></div>`;
  }).join('');
  const pts=groups.map((w,i)=>{
    const net=w.inc-w.exp;
    const x=(i+0.5)/groups.length*100;
    const y=100-clamp(net/maxNet,0,1)*80;
    return `${x.toFixed(2)},${y.toFixed(2)}`;
  }).join(' ');
  const dots=groups.map((w,i)=>{
    const net=w.inc-w.exp;
    const x=(i+0.5)/groups.length*100;
    const y=100-clamp(net/maxNet,0,1)*80;
    return `<span class="ndot" style="left:${x.toFixed(2)}%;top:${y.toFixed(2)}%"></span>`;
  }).join('');
  const yl=[];
  for(let i=0;i<5;i++){
    const v=niceMax*(i/4);
    yl.push(`<span class="ylab" style="top:${(1-i/4)*100}%">${v>=1000000?(v/1000000).toFixed(1).replace('.0','')+'M':fmt(v/10000)+'만'}</span>`);
  }
  const chHd=document.querySelector('.lg-chart .chart-hd');
  if(chHd){
    let rg=chHd.querySelector('.range');
    if(!rg){ rg=document.createElement('div'); rg.className='range'; rg.id='lgRange';
      rg.innerHTML='<button data-range="m">월간</button><button data-range="w">주간</button>';
      const lg=chHd.querySelector('.lg'); chHd.insertBefore(rg,lg);
      rg.addEventListener('click',ev=>{ const b=ev.target.closest('[data-range]'); if(!b) return; lgRange=b.dataset.range; renderLedger(); });
    }
    rg.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.range===lgRange));
  }
  const rl=document.getElementById('lgRangeLabel'); if(rl) rl.textContent=rangeLabel;
  document.getElementById('lgChart').innerHTML=`
    <div class="ylabs" style="position:absolute;inset:0 0 16px 0;pointer-events:none">${yl.join('')}</div>
    <div class="gridlines"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="bars">${bars}</div>
    <svg class="netline" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <polyline points="${pts}"/>
    </svg>
    <div class="netdots">${dots}</div>`;

  /* budget gauge + categories */
  const R=52, half=Math.PI*R;
  const arc=(cx,cy,r)=>`M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}`;
  document.getElementById('lgSide').innerHTML=`
    <div>
      <div class="chart-hd"><span class="t">예산 사용</span><span class="lg"><span>${usedPct}%</span></span></div>
      <div class="gauge">
        <svg viewBox="0 0 140 78" aria-label="예산 사용률">
          <defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#10B981"/><stop offset=".62" stop-color="#F59E0B"/><stop offset="1" stop-color="#F43F5E"/>
          </linearGradient></defs>
          <path d="${arc(70,70,52)}" fill="none" stroke="rgba(148,163,184,.12)" stroke-width="9" stroke-linecap="round"/>
          <path d="${arc(70,70,52)}" fill="none" stroke="url(#gg)" stroke-width="9" stroke-linecap="round"
            stroke-dasharray="${(half*Math.min(st.used,1)).toFixed(1)} ${half}" style="filter:drop-shadow(0 0 7px rgba(245,158,11,.45))"/>
          <g stroke="rgba(148,163,184,.28)" stroke-width="1">
            ${[0,1,2,3,4].map(i=>{const a=Math.PI-Math.PI*(i/4);const x1=70+Math.cos(a)*44,y1=70-Math.sin(a)*44;const x2=70+Math.cos(a)*40,y2=70-Math.sin(a)*40;return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`;}).join('')}
          </g>
        </svg>
        <div class="gl"><b>${usedPct}<small>% 사용</small></b><span>남은 ${fmt(st.remain)}원</span></div>
      </div>
    </div>
    <div>
      <div class="chart-hd"><span class="t">카테고리 비중</span></div>
      <div class="catbar">
        ${Object.entries(CATS).map(([c,col])=>{
          const v=st.byCat[c]||0; const p=st.exp? v/st.exp*100:0;
          return v? `<i style="flex:${p};background:${col}" title="${c} ${p.toFixed(0)}%"></i>`:'';
        }).join('')}
      </div>
      <div class="catlegend">
        ${Object.entries(CATS).map(([c,col])=>{
          const v=st.byCat[c]||0; const p=st.exp? Math.round(v/st.exp*100):0;
          return `<span><i style="background:${col}"></i>${c}<b>${p}%</b></span>`;
        }).join('')}
      </div>
    </div>`;

  /* recent */
  const recent=[...S.ledger].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  document.getElementById('lgRecent').innerHTML=
    `<span class="tagline">최근 기록</span>`+
    recent.map(e=>{
      const col=e.type==='in'?'#10B981':(CATS[e.cat]||'#F43F5E');
      const [,mm,dd]=e.date.split('-');
      return `<span class="entry"><i style="background:${col}"></i>${+mm}/${+dd} ${escapeHTML(e.cat)} <b class="${e.type==='in'?'pos':'neg'}">${e.type==='in'?'+':'-'}${fmt(e.amount)}</b></span>`;
    }).join('')+
    (!recent.length?`<span class="entry">기록이 없습니다</span>`:'');
}

let lgType='out', lgCat='식비', lgAmount='', lgRange='m';
function openLedgerModal(type){

  const cats=lgType==='out'?CATS:INCOME_CATS;

    </div>
    <div class="m-body">
      <div class="seg">
        <button data-type="out" class="on">지출</button>
        <button data-type="in">수입</button>
      </div>
      <div class="amt-display out" id="amtBox">
        <div class="al">금액</div>
        <div class="av" id="amtVal"><span class="cur">₩</span>0</div>
      </div>
      <div class="quick-amts">
        <button data-add="10000">+1만</button>
        <button data-add="50000">+5만</button>
        <button data-add="100000">+10만</button>
        <button data-add="500000">+50만</button>
        <button data-add="0" id="amtClear">지우기</button>
      </div>
      <div class="pad" id="pad">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}
        <button data-k="00">00</button>
        <button data-k="0">0</button>
        <button class="del" data-k="del">⌫</button>
      </div>
      <div class="m-sect">카테고리<i></i></div>
      <div class="cat-chips" id="catChips">
        ${Object.entries(cats).map(([c,col])=>`<button data-cat="${c}" class="${c===lgCat?'on':''}"><i style="background:${col}"></i>${c}</button>`).join('')}
      </div>
      <div class="fields">
        <div class="field"><label>날짜</label><input type="date" id="lgDate" value="${TODAY}"></div>
        <div class="field"><label>메모</label><input type="text" id="lgMemo" placeholder="예) 점심" maxlength="40"></div>
      </div>
    </div>
    <div class="m-foot">
      <button class="btn primary wide-btn" id="lgSave">기록하고 그래프 반영</button>
    </div>`,mount=>{
      const amtVal=mount.querySelector('#amtVal');
      const amtBox=mount.querySelector('#amtBox');
      const paint=()=>{
        amtVal.innerHTML=`<span class="cur">₩</span>${lgAmount?fmt(Number(lgAmount)):'0'}`;
        amtBox.className='amt-display '+(lgType==='out'?'out':'in');
      };
      const setType=t=>{
        lgType=t;
        mount.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.type===t));
        lgCat = t==='out'?'식비':'월급';
        const cc=t==='out'?CATS:INCOME_CATS;
        mount.querySelector('#catChips').innerHTML=Object.entries(cc).map(([c,col])=>
          `<button data-cat="${c}" class="${c===lgCat?'on':''}"><i style="background:${col}"></i>${c}</button>`).join('');
        paint();
      };
      mount.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>setType(b.dataset.type)));
      mount.querySelector('#catChips').addEventListener('click',e=>{
        const b=e.target.closest('[data-cat]'); if(!b) return;
        lgCat=b.dataset.cat;
        mount.querySelectorAll('#catChips button').forEach(x=>x.classList.toggle('on',x.dataset.cat===lgCat));
      });
      mount.querySelector('#pad').addEventListener('click',e=>{
        const b=e.target.closest('[data-k]'); if(!b) return;
        const k=b.dataset.k;
        if(k==='del') lgAmount=lgAmount.slice(0,-1);
        else if(lgAmount.length<10) lgAmount=(lgAmount+k).replace(/^0+(?=\d)/,'');
        paint();
      });
      mount.querySelector('.quick-amts').addEventListener('click',e=>{
        const b=e.target.closest('[data-add]'); if(!b) return;
        const v=Number(b.dataset.add);
        if(!v){lgAmount='';paint();return;}
        lgAmount=String(clamp((Number(lgAmount||0)+v),0,99999999999));
        paint();
      });
      paint();
      mount.querySelector('#lgSave').addEventListener('click',()=>{
        const amt=Number(lgAmount||0);
        if(!amt){ toast('금액을 입력해 주세요'); return; }
        S.ledger.push({
          id:'e'+Date.now().toString(36), type:lgType, amount:amt, cat:lgCat,
          date:mount.querySelector('#lgDate').value||TODAY,
          memo:mount.querySelector('#lgMemo').value.trim()
        });
        save(); renderAll(); closeModal();
        toast(`${lgType==='out'?'지출':'수입'} ${won(amt)} 기록 완료`);
      });
    });
}

function setView(v){
  S.view=v; save();
  document.body.className='view-'+v;
  document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  document.querySelectorAll('#mnav button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));
  if(v==='portfolio'){ pfActive=-1; renderPortfolio(); }
  if(v==='ledger'){ renderLedger(); }
  window.scrollTo({top:0});
}
document.getElementById('views').addEventListener('click',e=>{
  const b=e.target.closest('[data-view]'); if(b) setView(b.dataset.view);
});
document.getElementById('mnav').addEventListener('click',e=>{
  const b=e.target.closest('[data-view]'); if(b) setView(b.dataset.view);
});

function openPopover(id,anchor){
  const pop=document.getElementById(id);
  const wasOpen=pop.classList.contains('open');
  document.querySelectorAll('.menu-pop.open').forEach(x=>x.classList.remove('open'));
  if(wasOpen) return;
  pop.classList.add('open');
  const r=anchor.getBoundingClientRect();
  const w=pop.offsetWidth, h=pop.offsetHeight;
  let left=Math.min(window.innerWidth-w-10, Math.max(10, r.right-w));
  let top=r.bottom+6;
  if(top+h>window.innerHeight-10) top=Math.max(10,r.top-h-6);
  pop.style.left=left+'px'; pop.style.top=top+'px';
}
document.addEventListener('click',e=>{
  if(e.target.closest('.menu-pop')) return;
  if(e.currentTarget.documentElement.contains(e.target)&&!e.target.closest('#menuBtn')&&!e.target.closest('#quickBtn')&&!e.target.closest('#demoChip')){
    document.querySelectorAll('.menu-pop.open').forEach(x=>x.classList.remove('open'));
  }
});

dataMenu.addEventListener('click',e=>{
  const b=e.target.closest('[data-d]'); if(!b) return;
  dataMenu.classList.remove('open');
  if(b.dataset.d==='export'){
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`command_board_${TODAY}.json`;
    a.click(); URL.revokeObjectURL(a.href);
    toast('JSON 백업 파일을 내려받았습니다');
  }
  if(b.dataset.d==='import'){
    const inp=document.createElement('input');
    inp.type='file'; inp.accept='application/json';
    inp.onchange=()=>{
      const f=inp.files[0]; if(!f) return;
      const r=new FileReader();
      r.onload=()=>{
        try{
          const p=JSON.parse(r.result);
          if(!p||!p.days) throw new Error('bad');
          S={version:2,days:p.days,ledger:p.ledger||[],holdings:p.holdings||[],
             budget:p.budget||2300000,history:(p.history&&Object.keys(p.history).length)?p.history:DEFAULT_HISTORY,
             briefing:Array.isArray(p.briefing)?p.briefing:null,
             briefChips:Array.isArray(p.briefChips)?p.briefChips:null,
             demo:false,view:S.view,calCursor:p.calCursor||S.calCursor};
          save(); renderAll();
          const dct=document.getElementById('demoChipTxt'); if(dct) dct.textContent='내 데이터 · 클릭해 수정';
          toast('백업을 불러왔습니다');
        }catch(err){ toast('파일을 읽을 수 없습니다'); }
      };
      r.readAsText(f);
    };
    inp.click();
  }
  if(b.dataset.d==='reset'){
    if(confirm('모든 기록을 지우고 예시 데이터로 되돌릴까요?')){
      S=seedState(); save(); renderAll(); toast('예시 데이터로 초기화했습니다');
    }
  }
});
